<!doctype html>
<!-- Open Graph preview, 1200 × 630. Rendered by scripts/og/render.mjs; the product visual is a real screenshot (source-heroflow.png). -->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=block" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 520px at 78% 46%, rgba(143, 179, 224, 0.07), transparent 70%),
      #050506;
    font-family: Inter, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .copy { position: absolute; left: 60px; top: 56px; bottom: 54px; width: 340px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 500; letter-spacing: -0.02em; }
  .brand img { height: 34px; }
  h1 { margin-top: auto; font-weight: 400; font-size: 60px; line-height: 1.02; letter-spacing: -0.045em; }
  h1 > span { display: block; }
  h1 .dim { color: rgba(255, 255, 255, 0.55); }
  h1 .dot { color: #a6ecc8; }
  p { margin-top: 26px; font-size: 22px; line-height: 1.38; letter-spacing: -0.012em; color: rgba(255, 255, 255, 0.62); }
  .url { margin-top: 28px; font-size: 15px; letter-spacing: 0.02em; color: rgba(255, 255, 255, 0.4); }
  .shot {
    position: absolute; left: 432px; top: 46px; width: 736px;
    border-radius: 14px; box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="mark.png" alt="" />Convolve</div>
    <h1><span class="dim">Build.</span><span class="dim">Backtest.</span><span>Improve<span class="dot">.</span></span></h1>
    <p>Convolutional neural networks for the stock market.</p>
    <div class="url">we-convolve.com</div>
  </div>
  <img class="shot" src="source-heroflow.png" alt="" />
</body>
</html>
